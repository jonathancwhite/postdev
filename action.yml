name: "PostDev Review"
description: "Bring-your-own-key AI code review for pull requests, plus a blast-radius check that tells agents which PRs are safe to auto-merge."
author: "PostDev"

branding:
  icon: "check-circle"
  color: "purple"

# Two ways to sign in to Anthropic for the review:
# - Keyless: set anthropic-federation-rule-id and anthropic-organization-id and
#   give the job `permissions: id-token: write`. No secret is stored.
# - A key: pass ANTHROPIC_API_KEY through `env` from a repository secret. It is
#   not an input, so it is never written into a workflow file.
# Guide: https://github.com/jonathancwhite/postdev/blob/main/docs/configuration.md#signing-in-to-anthropic
inputs:
  github-token:
    description: >-
      Token used to read the diff and post the review. Use the built-in
      GITHUB_TOKEN. Configuration guide:
      https://github.com/jonathancwhite/postdev/blob/main/docs/configuration.md#github-token
    required: false
    default: ${{ github.token }}
  model:
    description: >-
      Review model. Defaults to claude-sonnet-5-5 to keep costs low; set
      claude-opus-5-5 for the strongest reviews. How to change it:
      https://github.com/jonathancwhite/postdev/blob/main/docs/configuration.md#model
    required: false
    default: "claude-sonnet-5-5"
  fallback-model:
    description: >-
      Model tried once if the primary is unavailable. Configuration guide:
      https://github.com/jonathancwhite/postdev/blob/main/docs/configuration.md#fallback-model
    required: false
    default: "claude-sonnet-5"
  min-severity:
    description: >-
      Lowest severity to post — low, medium, high, or critical. Findings below
      it are skipped. Defaults to medium. Tuning noise:
      https://github.com/jonathancwhite/postdev/blob/main/docs/configuration.md#min-severity
    required: false
    default: "medium"
  review:
    description: >-
      Run the AI review. Needs keyless sign-in (the anthropic-federation-*
      inputs) or ANTHROPIC_API_KEY in `env`. Set false to run only
      the blast-radius check. Configuration guide:
      https://github.com/jonathancwhite/postdev/blob/main/docs/configuration.md#review
    required: false
    default: "true"
  anthropic-federation-rule-id:
    description: >-
      Federation rule ID (fdrl_...) from the Claude Console's Workload identity
      page. With anthropic-organization-id, turns on keyless sign-in through
      GitHub OIDC; the job needs `permissions: id-token: write`. Not a secret.
    required: false
    default: ""
  anthropic-organization-id:
    description: >-
      Your Anthropic organization ID (a UUID), for keyless sign-in. Not a secret.
    required: false
    default: ""
  anthropic-workspace-id:
    description: >-
      Workspace ID (wrkspc_...). Only needed when the federation rule covers
      more than one workspace.
    required: false
    default: ""
  anthropic-service-account-id:
    description: >-
      Optional service account ID (svac_...). If set, it must be the account
      the federation rule targets.
    required: false
    default: ""
  anthropic-oidc-audience:
    description: >-
      Audience requested on the GitHub OIDC token. Must match the federation
      rule's audience.
    required: false
    default: "https://api.anthropic.com"
  blast-radius:
    description: >-
      Work out the pull request's blast radius and post it as the "PostDev blast
      radius" check, a sticky comment and a blast:* label. No model key needed.
      Guide: https://github.com/jonathancwhite/postdev/blob/main/docs/blast-radius.md
    required: false
    default: "false"
  config:
    description: >-
      Path of the PostDev config file, read from the base branch so a pull
      request cannot change its own rules. Guide:
      https://github.com/jonathancwhite/postdev/blob/main/docs/blast-radius.md#config
    required: false
    default: ".github/postdev.json"
  blast-radius-labels:
    description: >-
      Set a blast:auto, blast:review or blast:human label on the pull request.
      Needs `issues: write`. Set false to skip labels.
    required: false
    default: "true"
  bot-login:
    description: >-
      The account the review posts under, used to skip comments already made on
      earlier pushes. Defaults to github-actions[bot]. Configuration guide:
      https://github.com/jonathancwhite/postdev/blob/main/docs/configuration.md#bot-login
    required: false
    default: "github-actions[bot]"

outputs:
  blast-radius-verdict:
    description: >-
      auto, review or human, when the blast-radius check ran.

runs:
  using: "node24"
  main: "dist/action/index.js"
